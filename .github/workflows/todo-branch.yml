name: Todo to Branch

on:
  schedule:
   - cron: '2/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: todo-to-branch
  cancel-in-progress: false

jobs:
  create-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create branches for Todo issues
        run: node .github/scripts/create-branches.mjs
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # --- change these three when moving to production ---
          TEAM_KEY: SBX
          STATE_NAME: Todo
          BASE_BRANCH: development
